<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>deebug</> | Conversation Intelligence Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #334155;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --emerald: #059669;
      --radius: 8px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: baseline;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      font-size: 16.5px;
      user-select: none;
    }

    .brand-logo .logo-dee { color: #0f172a; }
    .brand-logo .logo-bug { color: #2563eb; }
    .brand-logo .logo-tag {
      color: #881337;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.62em;
      font-weight: 800;
      margin-left: 2px;
      vertical-align: top;
      position: relative;
      top: -0.32em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all .15s ease;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #ffffff;
    }

    /* ── FULLSCREEN POSTER GRID (ZERO SCROLL) ── */
    .poster-grid {
      flex: 1;
      width: 100vw;
      height: calc(100vh - 44px);
      padding: 8px 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      overflow: hidden;
    }

    /* ── TOP STATS RIBBON ── */
    .stats-ribbon {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }

    .stat-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .stat-meta {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-sub {
      font-size: 10px;
      color: #64748b;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── MAIN 3-COLUMN MID SECTION ── */
    .dashboard-mid {
      display: grid;
      grid-template-columns: 31% 37% 32%;
      gap: 8px;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .dash-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    /* ── TILES (COMPACT, NO SCROLL) ── */
    .dash-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      gap: 6px;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .tile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tile-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tile-badge {
      font-size: 9.5px;
      font-weight: 600;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 4px;
      color: var(--muted);
    }

    .tile-content-fit {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 6px;
      overflow: hidden;
    }

    /* ── 1. DEEP INDUSTRY INSIGHTS (CLEAN BORDERED CARDS) ── */
    .deep-insight-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 5px 5px 0;
      padding: 6px 9px;
      display: flex;
      flex-direction: column;
      gap: 2.5px;
    }

    .deep-insight-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }

    .deep-insight-body {
      font-size: 10px;
      line-height: 1.35;
      color: #334155;
    }

    /* ── 1B. CONVERSATION SNAPSHOT WRAPPER ── */
    .snapshot-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 11px;
      justify-content: flex-start;
    }

    .snapshot-p {
      font-size: 10.5px;
      line-height: 1.45;
      color: #334155;
      margin: 0;
    }

    /* ── 2. REAL WORD CLOUD CANVAS CONTAINER ── */
    .wordcloud-canvas-wrap {
      flex: 1;
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    #realWordCloudCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wordcloud-badge {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 9px;
      font-weight: 600;
      color: var(--muted);
      background: #ffffff;
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid var(--border);
      pointer-events: none;
    }

    /* ── 3. REAL 0 TO 100 TOPIC PROGRESSION GRAPH ── */
    .topic-graph-wrap {
      flex: 1;
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    #topicGraphCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .topic-graph-badge {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 8.5px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      background: #ffffff;
      padding: 1.5px 6px;
      border-radius: 3px;
      border: 1px solid var(--border);
      pointer-events: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    /* ── 4. QUOTES & SNAPSHOT ── */
    .quote-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-left: 2.5px solid #64748b;
      border-radius: 0 5px 5px 0;
      padding: 5px 8px;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .quote-line {
      font-style: italic;
      color: #1e293b;
      line-height: 1.35;
    }

    .quote-by {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    /* ── 5. BOTTOM SPEAKER PARTICIPATION GRAPH (TALK TIME) ── */
    .bottom-speaker-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }

    .speaker-bar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .speaker-distribution-track {
      height: 9px;
      width: 100%;
      background: #e2e8f0;
      border-radius: 5px;
      overflow: hidden;
      display: flex;
    }

    .speaker-segment {
      height: 100%;
      transition: width .3s ease;
      cursor: pointer;
    }

    .speaker-pills-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .speaker-share-pill {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pill-color-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .pill-name {
      font-weight: 700;
      color: var(--text);
    }

    .pill-pct {
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
    }

    .empty-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #e2e8f0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media print {
      header, .btn { display: none !important; }
      body, .poster-grid {
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        background: #ffffff !important;
      }
      .dash-tile, .stat-tile, .bottom-speaker-bar {
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
      }
    }
  </style>
</head>

<body>

  <!-- ── HEADER ── -->
  <header>
    <div class="brand-group">
      <span class="brand-logo"><span class="logo-dee">dee</span><span class="logo-bug">bug</span><sup class="logo-tag">&lt;/&gt;</sup></span>
      <button class="btn" id="btnPrint" onclick="window.print()" title="Export PDF Poster">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
    </div>
    <div class="header-right">
      <button class="btn btn-primary" id="btnRegenerate" title="Regenerate Poster">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38l5.67-5.67"/></svg>
        Regenerate
      </button>
    </div>
  </header>

  <!-- ── FULLSCREEN POSTER GRID (ZERO SCROLL) ── -->
  <main class="poster-grid" id="posterRoot">
    <div class="empty-tile">
      <div class="spinner"></div>
      <div>Loading intelligence poster...</div>
    </div>
  </main>

  <script>
    (function () {
      let roomData = null;
      const posterRoot = document.getElementById('posterRoot');
      const btnRegenerate = document.getElementById('btnRegenerate');

      const PALETTE = ['#2563eb', '#475569', '#059669', '#d97706', '#7c3aed', '#0284c7', '#dc2626', '#4b5563'];

      function safeStr(val, fallback = '') {
        if (val === null || val === undefined) return fallback;
        return String(val);
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderPoster(data) {
        if (!data || data.exists === false || (!data.speakers && !data.executive_synthesis && !data.executive_summary)) {
          posterRoot.innerHTML = `
            <div class="empty-tile">
              <strong style="font-size: 14px; color: var(--text);">No Synthesis Generated Yet</strong>
              <p style="font-size: 11.5px; max-width: 400px;">
                Synthesize all conversations, topic progression streamgraph, industry insights, and speaker talk distribution.
              </p>
              <button class="btn btn-primary" onclick="window.triggerRegen()" style="margin-top: 4px;">
                Generate Poster
              </button>
            </div>
          `;
          return;
        }

        const stats = data.room_stats || {
          total_speakers: (data.speakers || []).length,
          total_turns: 0,
          total_words: 0,
          topics_count: 4
        };

        const synthesis = safeStr(data.executive_synthesis || data.executive_summary, '');
        const paragraphs = synthesis.split(/\n\n+/).filter(Boolean);

        const deepInsights = Array.isArray(data.deep_insights) ? data.deep_insights.slice(0, 4) : [];
        const wordCloud = Array.isArray(data.word_cloud) ? data.word_cloud : [];
        const voiceSpotlights = Array.isArray(data.voice_spotlights) ? data.voice_spotlights.slice(0, 3) : [];
        const topicProgression = Array.isArray(data.topic_progression) ? data.topic_progression.slice(0, 4) : [];

        const speakerShares = Array.isArray(data.speaker_shares) && data.speaker_shares.length > 0
          ? data.speaker_shares
          : (data.speakers || []).map((s, i) => ({ name: s.name || 'Speaker ' + (i+1), percentage: Math.round(100 / ((data.speakers || []).length || 1)), words: 200 }));

        const startTimeBadge = topicProgression[0]?.time_range ? topicProgression[0].time_range.split('–')[0].split('-')[0].trim() : '12:00 PM';
        const endTimeBadge = topicProgression[topicProgression.length - 1]?.time_range ? topicProgression[topicProgression.length - 1].time_range.split('–').pop().split('-').pop().trim() : '12:45 PM';

        posterRoot.innerHTML = `
          <!-- ── 1. TOP STATS RIBBON ── -->
          <div class="stats-ribbon">
            <div class="stat-tile">
              <div class="stat-meta">
                <span class="stat-label">Active Contributors</span>
                <span class="stat-sub">In The Room</span>
              </div>
              <span class="stat-val">${stats.total_speakers || speakerShares.length}</span>
            </div>
            <div class="stat-tile">
              <div class="stat-meta">
                <span class="stat-label">Spoken Exchanges</span>
                <span class="stat-sub">Dialogue Turns</span>
              </div>
              <span class="stat-val">${stats.total_turns || '—'}</span>
            </div>
            <div class="stat-tile">
              <div class="stat-meta">
                <span class="stat-label">Discourse Volume</span>
                <span class="stat-sub">Words Synthesized</span>
              </div>
              <span class="stat-val">${stats.total_words ? stats.total_words.toLocaleString() : '—'}</span>
            </div>
            <div class="stat-tile">
              <div class="stat-meta">
                <span class="stat-label">Key Topics</span>
                <span class="stat-sub">Concepts Touched</span>
              </div>
              <span class="stat-val">${wordCloud.length || 8}</span>
            </div>
          </div>

          <!-- ── 2. MAIN 3-COLUMN MID SECTION ── -->
          <div class="dashboard-mid">

            <!-- ── LEFT: 4 DEEP INDUSTRY INSIGHTS & OVERVIEW ── -->
            <div class="dash-col">
              <!-- Tile 1: 4 Deep Industry Insights -->
              <div class="dash-tile" style="flex: 1.15;">
                <div class="tile-header">
                  <span class="tile-title">Deep Industry Insights</span>
                  <span class="tile-badge">4 Takeaways</span>
                </div>
                <div class="tile-content-fit">
                  ${deepInsights.map((ins, i) => `
                    <div class="deep-insight-card">
                      <span class="deep-insight-title">${escapeHtml(ins.title || 'Insight #' + (i + 1))}</span>
                      <span class="deep-insight-body">${escapeHtml(ins.insight || '')}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Tile 2: Conversation Snapshot -->
              <div class="dash-tile" style="flex: 0.85;">
                <div class="tile-header">
                  <span class="tile-title">Conversation Snapshot</span>
                  <span class="tile-badge">Chronological Flow</span>
                </div>
                <div class="snapshot-wrap">
                  ${paragraphs.slice(0, 2).map(p => `<p class="snapshot-p">${escapeHtml(p)}</p>`).join('')}
                </div>
              </div>
            </div>

            <!-- ── CENTER: REAL MULTI-DIRECTIONAL WORD CLOUD ── -->
            <div class="dash-col">
              <div class="dash-tile" style="height: 100%;">
                <div class="tile-header">
                  <span class="tile-title">Topic Word Cloud</span>
                  <span class="tile-badge">${wordCloud.length} Concepts</span>
                </div>
                <div class="wordcloud-canvas-wrap">
                  <canvas id="realWordCloudCanvas"></canvas>
                  <div class="wordcloud-badge">Discourse Density & Weight</div>
                </div>
              </div>
            </div>

            <!-- ── RIGHT: 0 TO 100 TOPIC PROGRESSION GRAPH & SOUNDBITES ── -->
            <div class="dash-col">
              <!-- Tile 3: 0 to 100 Topic Progression Graph -->
              <div class="dash-tile" style="flex: 1.25;">
                <div class="tile-header">
                  <span class="tile-title">Topic Chronological Progression</span>
                  <span class="tile-badge">0 &rarr; 100 Timeline Graph</span>
                </div>
                <div class="topic-graph-wrap">
                  <canvas id="topicGraphCanvas"></canvas>
                  <div class="topic-graph-badge">0% &rarr; 100% TIMELINE</div>
                </div>
              </div>

              <!-- Tile 4: Key Soundbites -->
              <div class="dash-tile" style="flex: 0.85;">
                <div class="tile-header">
                  <span class="tile-title">Key Soundbites</span>
                  <span class="tile-badge">${voiceSpotlights.length} Quotes</span>
                </div>
                <div class="tile-content-fit">
                  ${voiceSpotlights.map(q => `
                    <div class="quote-item">
                      <span class="quote-line">"${escapeHtml(q.quote || '')}"</span>
                      <span class="quote-by">
                        <span>— ${escapeHtml(q.speaker || 'Guest')}</span>
                        <span style="color: var(--muted);">${escapeHtml(q.company || '')}</span>
                      </span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

          </div>

          <!-- ── 3. BOTTOM: SPEAKER PARTICIPATION GRAPH (TALK TIME) ── -->
          <div class="bottom-speaker-bar">
            <div class="speaker-bar-header">
              <span class="tile-title">Speaker Participation & Talk Share</span>
              <span style="font-size: 10px; color: var(--muted); font-weight: 600;">Distribution across all ${speakerShares.length} contributors</span>
            </div>

            <!-- Proportion Progress Track -->
            <div class="speaker-distribution-track">
              ${speakerShares.map((spk, idx) => {
                const color = PALETTE[idx % PALETTE.length];
                return `<div class="speaker-segment" style="width: ${spk.percentage || 10}%; background: ${color};" title="${escapeHtml(spk.name)}: ${spk.percentage}% (${spk.words || 0} words)"></div>`;
              }).join('')}
            </div>

            <!-- Speaker Badges Row -->
            <div class="speaker-pills-row">
              ${speakerShares.slice(0, 10).map((spk, idx) => {
                const color = PALETTE[idx % PALETTE.length];
                return `
                  <div class="speaker-share-pill">
                    <div class="pill-color-dot" style="background: ${color};"></div>
                    <span class="pill-name">${escapeHtml(spk.name)}</span>
                    <span class="pill-pct">${spk.percentage}%</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;

        // Render Canvas Word Cloud
        initRealWordCloud(wordCloud);

        // Render Canvas 0 to 100 Topic Progression Graph
        initTopicProgressionGraph(topicProgression, stats.total_turns || 84);
      }

      // ── ROBUST 2D COLLISION-FREE WORD CLOUD ENGINE (RETINA 4K) ──
      function initRealWordCloud(words) {
        const canvas = document.getElementById('realWordCloudCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 2;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.scale(dpr, dpr);

        ctx.clearRect(0, 0, rect.width, rect.height);

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const sortedWords = [...words].sort((a, b) => (b.weight || 50) - (a.weight || 50));
        const maxW = sortedWords[0]?.weight || 100;
        const minW = sortedWords[sortedWords.length - 1]?.weight || 30;

        const placedBoxes = [];

        function checkOverlap(box, padding = 6) {
          const b1 = {
            x1: box.x1 - padding,
            y1: box.y1 - padding,
            x2: box.x2 + padding,
            y2: box.y2 + padding
          };

          if (b1.x1 < 4 || b1.y1 < 4 || b1.x2 > rect.width - 4 || b1.y2 > rect.height - 4) {
            return true;
          }

          for (let i = 0; i < placedBoxes.length; i++) {
            const b2 = placedBoxes[i];
            if (!(b1.x2 < b2.x1 || b1.x1 > b2.x2 || b1.y2 < b2.y1 || b1.y1 > b2.y2)) {
              return true;
            }
          }
          return false;
        }

        sortedWords.forEach((item, idx) => {
          const rawWeight = item.weight || 60;
          const norm = (rawWeight - minW) / (maxW - minW || 1);

          const fontSize = Math.round(10.5 + norm * 13.5); // 10.5px to 24px
          const isBold = norm > 0.4 ? 'bold ' : '600 ';
          ctx.font = `${isBold}${fontSize}px 'Plus Jakarta Sans', sans-serif`;

          const text = item.text || 'Concept';
          const metrics = ctx.measureText(text);
          const textW = Math.ceil(metrics.width);
          const textH = Math.ceil(fontSize * 1.18);

          const isVertical = (idx % 4 === 3 && textW < rect.height * 0.42 && idx > 0);

          const boxW = isVertical ? textH : textW;
          const boxH = isVertical ? textW : textH;

          let placed = false;
          let angle = idx * 1.7;
          const angleStep = 0.18;
          const radiusStep = 0.8;

          for (let step = 0; step < 450; step++) {
            const r = step * radiusStep * (step < 60 ? 0.75 : 1.05);
            const x = Math.round(centerX + Math.cos(angle) * r - boxW / 2);
            const y = Math.round(centerY + Math.sin(angle) * r * 0.7 - boxH / 2);

            const candidate = {
              x1: x,
              y1: y,
              x2: x + boxW,
              y2: y + boxH,
              text: text,
              x: x,
              y: y,
              boxW: boxW,
              boxH: boxH,
              isVertical: isVertical,
              fontSize: fontSize,
              weight: rawWeight,
              color: idx === 0 ? '#1d4ed8' : (idx < 5 ? '#0f172a' : (idx < 10 ? '#334155' : '#64748b'))
            };

            if (!checkOverlap(candidate, 5)) {
              placedBoxes.push(candidate);
              placed = true;
              break;
            }

            angle += angleStep;
          }
        });

        let hoveredIndex = -1;

        function drawCloud() {
          ctx.clearRect(0, 0, rect.width, rect.height);

          placedBoxes.forEach((box, i) => {
            ctx.save();
            const isHover = hoveredIndex === i;

            const isBold = box.weight > 65 ? '800 ' : (box.weight > 50 ? '700 ' : '600 ');
            ctx.font = `${isBold}${box.fontSize}px 'Plus Jakarta Sans', sans-serif`;
            ctx.textBaseline = 'top';
            ctx.textAlign = 'left';
            ctx.fillStyle = isHover ? '#2563eb' : box.color;

            if (box.isVertical) {
              ctx.translate(box.x + box.boxW, box.y);
              ctx.rotate(Math.PI / 2);
              ctx.fillText(box.text, 0, 0);
            } else {
              ctx.fillText(box.text, box.x, box.y);
            }

            ctx.restore();
          });
        }

        drawCloud();

        canvas.addEventListener('mousemove', (e) => {
          const r = canvas.getBoundingClientRect();
          const mx = e.clientX - r.left;
          const my = e.clientY - r.top;

          const prevHover = hoveredIndex;
          hoveredIndex = placedBoxes.findIndex(b => mx >= b.x1 && mx <= b.x2 && my >= b.y1 && my <= b.y2);

          if (hoveredIndex !== prevHover) {
            canvas.style.cursor = hoveredIndex !== -1 ? 'pointer' : 'default';
            drawCloud();
          }
        });
      }

      // ── ULTRA HIGH-QUALITY VERTICAL ASCENDING 0 TO 100 PROGRESSION GRAPH (4K RETINA & FULLY RESPONSIVE) ──
      function initTopicProgressionGraph(phases, totalTurns) {
        const canvas = document.getElementById('topicGraphCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const rect = canvas.parentElement.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;

        const dpr = window.devicePixelRatio || 2;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.scale(dpr, dpr);

        ctx.clearRect(0, 0, rect.width, rect.height);

        const pad = { top: 24, bottom: 24, left: 14, right: 14 };
        const w = rect.width - pad.left - pad.right;
        const h = rect.height - pad.top - pad.bottom;

        const centerX = pad.left + w / 2;
        const startY = pad.top + h - 8; // 0% at bottom
        const endY = pad.top + 10;      // 100% at top

        const count = Math.max(1, (phases || []).length || 4);
        const availableHeight = startY - endY;
        const stepY = availableHeight / count;

        // Dynamic responsive card geometry based on available canvas space
        const cardW = Math.min(230, Math.max(120, (w / 2) - 32));
        const cardH = Math.min(54, Math.max(38, stepY * 0.78));

        // 1. Draw Sleek Vertical Guideline Track (0% -> 100%)
        const spineGrad = ctx.createLinearGradient(0, startY, 0, endY);
        spineGrad.addColorStop(0, '#2563eb');
        spineGrad.addColorStop(0.33, '#475569');
        spineGrad.addColorStop(0.66, '#059669');
        spineGrad.addColorStop(1, '#d97706');

        // Outer glow track
        ctx.beginPath();
        ctx.moveTo(centerX, startY);
        ctx.lineTo(centerX, endY);
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // Active gradient spine
        ctx.beginPath();
        ctx.moveTo(centerX, startY);
        ctx.lineTo(centerX, endY);
        ctx.strokeStyle = spineGrad;
        ctx.lineWidth = 2.2;
        ctx.stroke();

        // 0% Start Tag Badge at bottom
        ctx.font = '700 8.5px "JetBrains Mono", monospace';
        ctx.fillStyle = '#64748b';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('0% START', centerX, startY + 5);

        // 100% Conclusion Tag Badge at top
        ctx.font = '700 8.5px "JetBrains Mono", monospace';
        ctx.fillStyle = '#0f172a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('100% CONCLUSION', centerX, endY - 5);

        // 2. Render 4 Milestones & Alternating Left/Right High-Resolution Cards
        (phases || []).forEach((ph, idx) => {
          const nodeY = startY - (idx + 0.5) * stepY;
          const isLeft = idx % 2 === 0; // 0 & 2 on LEFT, 1 & 3 on RIGHT
          const baseColor = PALETTE[idx % PALETTE.length];

          // Outer glowing halo ring on center node
          ctx.beginPath();
          ctx.arc(centerX, nodeY, 8, 0, Math.PI * 2);
          ctx.fillStyle = `${baseColor}20`;
          ctx.fill();

          // Solid Inner Node Marker
          ctx.beginPath();
          ctx.arc(centerX, nodeY, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = baseColor;
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          // Milestone Percentage Pill on Center Spine
          const pctText = `${(idx + 1) * 25}%`;
          ctx.font = '700 7px "JetBrains Mono", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(pctText, centerX, nodeY);

          // Curved Smooth Leader Branch to Card
          const branchEndX = isLeft ? centerX - 24 : centerX + 24;
          ctx.beginPath();
          ctx.moveTo(centerX + (isLeft ? -5 : 5), nodeY);
          ctx.lineTo(branchEndX, nodeY);
          ctx.strokeStyle = baseColor;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Branch Anchor Dot
          ctx.beginPath();
          ctx.arc(branchEndX, nodeY, 2.2, 0, Math.PI * 2);
          ctx.fillStyle = baseColor;
          ctx.fill();

          // Card Coordinates
          const cardX = isLeft ? (branchEndX - cardW) : branchEndX;
          const cardY = nodeY - cardH / 2;

          // Draw Card Shadow & Background Box
          ctx.save();
          ctx.shadowColor = 'rgba(15, 23, 42, 0.05)';
          ctx.shadowBlur = 6;
          ctx.shadowOffsetY = 1.5;

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.roundRect(cardX, cardY, cardW, cardH, 5);
          ctx.fill();
          ctx.restore();

          // Card Border
          ctx.strokeStyle = `${baseColor}40`;
          ctx.lineWidth = 1.1;
          ctx.stroke();

          // Distinct Accent Vertical Color Bar on outer edge
          ctx.fillStyle = baseColor;
          ctx.beginPath();
          if (isLeft) {
            ctx.roundRect(cardX + cardW - 3, cardY, 3, cardH, [0, 5, 5, 0]);
          } else {
            ctx.roundRect(cardX, cardY, 3, cardH, [5, 0, 0, 5]);
          }
          ctx.fill();

          // Card Header: Quarter Tag Badge + Turn Range
          const contentX = isLeft ? cardX + 7 : cardX + 9;
          const maxTextW = cardW - 14;

          const isCompact = cardH < 46;
          const headerSize = isCompact ? '7px' : '7.5px';
          const titleSize = isCompact ? '8px' : '8.5px';
          const bulletSize = isCompact ? '7px' : '7.5px';

          ctx.font = `700 ${headerSize} "JetBrains Mono", monospace`;
          ctx.fillStyle = baseColor;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          const qBadge = ph.phase_label || `${idx*25}%–${(idx+1)*25}%`;
          const tRange = ph.turn_range || '';
          ctx.fillText(`${qBadge}  ·  ${tRange}`, contentX, cardY + (isCompact ? 4 : 5));

          // Phase Title
          ctx.font = `bold ${titleSize} "Plus Jakarta Sans", sans-serif`;
          ctx.fillStyle = '#0f172a';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          const rawTitle = (ph.phase || `Phase ${idx+1}`).replace(/^Phase \d+:\s*/i, '');
          ctx.fillText(rawTitle, contentX, cardY + (isCompact ? 13 : 15), maxTextW);

          // 2 Key Topic Bullets (Full visibility, responsive text)
          const topicsList = Array.isArray(ph.topics) ? ph.topics : (ph.topic ? [ph.topic] : []);
          const top1 = topicsList[0] || 'Core Discussion Focus';
          const top2 = topicsList[1] || 'Architectural Consensus';

          ctx.font = `600 ${bulletSize} "Plus Jakarta Sans", sans-serif`;
          ctx.fillStyle = '#334155';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';

          ctx.fillText(`▸ ${top1}`, contentX, cardY + (isCompact ? 23 : 26), maxTextW);
          ctx.fillText(`▸ ${top2}`, contentX, cardY + (isCompact ? 32 : 36), maxTextW);
        });
      }

      async function loadData(forceRefresh = false) {
        if (forceRefresh) {
          btnRegenerate.disabled = true;
          btnRegenerate.innerHTML = `<div class="spinner" style="width: 10px; height: 10px; border-width: 1.5px;"></div> Generating...`;
          posterRoot.innerHTML = `
            <div class="empty-tile">
              <div class="spinner"></div>
              <strong style="font-size: 13px;">Synthesizing Intelligence Poster...</strong>
              <span style="font-size: 11px; color: var(--muted);">Rendering topic progression streamgraph, word cloud, and deep insights</span>
            </div>
          `;
        }

        try {
          const resp = await fetch('/api/deep-analysis', {
            method: forceRefresh ? 'POST' : 'GET',
            headers: { 'Content-Type': 'application/json' },
            body: forceRefresh ? JSON.stringify({ force_refresh: true }) : null
          });
          if (resp.ok) {
            roomData = await resp.json();
            renderPoster(roomData);
          }
        } catch (err) {
          posterRoot.innerHTML = `
            <div class="empty-tile">
              <span style="color: #dc2626; font-weight: 700;">Failed to load synthesis.</span>
              <span style="font-size: 11px;">${escapeHtml(err.message)}</span>
            </div>
          `;
        } finally {
          btnRegenerate.disabled = false;
          btnRegenerate.innerHTML = `
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38l5.67-5.67"/></svg>
            Regenerate
          `;
        }
      }

      // Responsive redraw on container/window resize
      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (roomData && roomData.exists) {
            initRealWordCloud(roomData.word_cloud || []);
            initTopicProgressionGraph(roomData.topic_progression || [], roomData.room_stats?.total_turns || 84);
          }
        }, 100);
      });

      window.triggerRegen = () => loadData(true);
      btnRegenerate.addEventListener('click', () => loadData(true));

      loadData(false);
    })();
  </script>
