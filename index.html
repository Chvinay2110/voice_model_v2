  <!-- ── AI ANALYSIS SIDEBAR ── -->
  <div id="aiSidebar">
    <div class="sb-header">
      <span class="sb-title"><span class="sb-pulse-dot"></span> Speaker Intelligence</span>
      <button class="sb-close" id="sbClose">&times;</button>
    </div>
    <div class="sb-body" id="sbBody"></div>
  </div>

  <script>
    (function () {
      // ── Mute console outputs ──────────────────────────────────────────────
      console.log = function () { };
      console.info = function () { };
      console.debug = function () { };
      console.warn = function () { };
      console.error = function () { };

      // ── Elements ──────────────────────────────────────────────────────────
      const homePage = document.getElementById('home-page');
      const appPage = document.getElementById('app-page');
      const startBtn = document.getElementById('startBtn');
      const btnToggleTranscribe = document.getElementById('btnToggleTranscribe');
      const downloadBtn = document.getElementById('downloadBtn') || { addEventListener: () => {} };
      const speakerContainer = document.getElementById('speakerContainer');
      const emptyState = document.getElementById('emptyState');
      const interimBar = document.getElementById('interimBar');
      const btnEnglish = document.getElementById('btnEnglish');
      const btnHindi = document.getElementById('btnHindi');

      function updateTranscribeButtonUI(isTranscribing) {
        if (!btnToggleTranscribe) return;
        if (isTranscribing) {
          btnToggleTranscribe.className = 'btn btn-transcribe-toggle running';
          btnToggleTranscribe.textContent = 'Stop Transcribing';
        } else {
          btnToggleTranscribe.className = 'btn btn-transcribe-toggle paused';
          btnToggleTranscribe.textContent = 'Start Transcribing';
        }
      }

      function setStatus(msg) { /* status removed from header */ }

      // ── Speaker colours ───────────────────────────────────────────────────
      const SPEAKER_COLORS = [
        '#4f46e5', // Indigo
        '#ea580c', // Orange
        '#16a34a', // Green
        '#9333ea', // Purple
        '#0284c7', // Sky blue
        '#e11d48', // Rose
        '#ca8a04', // Yellow-gold
        '#0d9488', // Teal
      ];
      let speakerColorIndex = 0;
      const speakerColorMap = {};
      function getSpeakerColor(speakerId) {
        if (speakerId === '?') return '#64748b'; // Slate grey for unknown
        if (!speakerColorMap[speakerId]) {
          speakerColorMap[speakerId] = SPEAKER_COLORS[speakerColorIndex % SPEAKER_COLORS.length];
          speakerColorIndex++;
        }
        return speakerColorMap[speakerId];
      }

      function speakerName(speakerId) {
        if (!speakerId || speakerId === '?') return 'Speaker A';
        const box = speakerBoxes[speakerId];
        return box ? box.name : `Speaker ${speakerId}`;
      }

      // ── State ─────────────────────────────────────────────────────────────
      // speakerBoxes[id] = { boxEl, bodyEl, color, name, turns:[] }
      const speakerBoxes = {};
      // activeTurns[turnOrder] = { turnEl, speakerId }
      const activeTurns = {};
      // finalizedTurns[turnOrder] = { turnEl, speakerId, text, duration }
      const finalizedTurns = {};
      // rawLines for download
      const rawLines = [];  // {time, text, speakerId}
      // interim element reuse
      let interimEl = null;

      // ── View mode (original | en | hi) ────────────────────────────────────
      let viewMode = 'original'; // 'original' | 'en' | 'hi'

      // ── Speaking Time Chart.js ───────────────────────────────────────────
      let chartInstance = null;
      function initSpeakingChart() {
        if (chartInstance) return;
        const canvas = document.getElementById('speakingChartCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: [],
            datasets: [{
              label: 'Speaking Share (%)',
              data: [],
              backgroundColor: [],
              borderRadius: 6,
              barThickness: 24,
              maxBarThickness: 32
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function (context) {
                    return ` ${context.raw}% speaking share`;
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                max: 100,
                ticks: {
                  callback: function (val) { return val + '%'; },
                  font: { family: 'Inter', size: 11 },
                  color: '#64748b',
                  stepSize: 25
                },
                grid: { color: '#e2e8f0' }
              },
              x: {
                ticks: {
                  font: { family: 'Inter', size: 12, weight: '600' },
                  color: '#1e293b'
                },
                grid: { display: false }
              }
            }
          }
        });
      }

      function recalculateSpeakingChart(fTurns) {
        initSpeakingChart();
        if (!chartInstance) return;

        const nameDurations = {};
        for (const turn of Object.values(fTurns)) {
          if (!turn || !turn.speakerId) continue;
          const sName = speakerName(turn.speakerId).trim();
          if (!sName || sName.toLowerCase() === 'pending' || sName.includes('?')) continue;
          nameDurations[sName] = (nameDurations[sName] || 0) + (turn.duration || 1);
        }

        const speakerNames = Object.keys(nameDurations);
        if (speakerNames.length === 0) {
          const alreadyEmpty = chartInstance.data.labels.length === 0;
          chartInstance.data.labels = [];
          chartInstance.data.datasets[0].data = [];
          chartInstance.data.datasets[0].backgroundColor = [];
          if (!alreadyEmpty) chartInstance.update('none');
          return;
        }

        const totalDur = speakerNames.reduce((sum, name) => sum + nameDurations[name], 0) || 1;

        // Sort by duration descending
        speakerNames.sort((a, b) => nameDurations[b] - nameDurations[a]);

        const labels = speakerNames;
        const data = speakerNames.map(name => Math.round((nameDurations[name] / totalDur) * 100));
        const colors = speakerNames.map((name, idx) => {
          const box = getOrCreateSpeakerBox(name);
          return (box && box.color) || SPEAKER_COLORS[idx % SPEAKER_COLORS.length];
        });

        const unchanged = JSON.stringify(chartInstance.data.labels) === JSON.stringify(labels)
          && JSON.stringify(chartInstance.data.datasets[0].data) === JSON.stringify(data)
          && JSON.stringify(chartInstance.data.datasets[0].backgroundColor) === JSON.stringify(colors);
        if (!unchanged) {
          chartInstance.data.labels = labels;
          chartInstance.data.datasets[0].data = data;
          chartInstance.data.datasets[0].backgroundColor = colors;
          chartInstance.update('none');
        }
      }

      // ── Phonetic Devanagari to Roman (Hinglish) Transliterator ───────────
      function transliterateDevanagariToRoman(text) {
        if (!text || !/[\u0900-\u097F]/.test(text)) return text;

        const VOWELS = {
          'अ': 'a', 'आ': 'aa', 'इ': 'i', 'ई': 'ee', 'उ': 'u', 'ऊ': 'oo',
          'ऋ': 'ri', 'ए': 'e', 'ऐ': 'ai', 'ओ': 'o', 'औ': 'au',
          'अं': 'an', 'अः': 'ah', 'ॐ': 'om'
        };

        const MATRAS = {
          'ा': 'aa', 'ि': 'i', 'ी': 'ee', 'ु': 'u', 'ू': 'oo',
          'ृ': 'ri', 'े': 'e', 'ै': 'ai', 'ो': 'o', 'ौ': 'au',
          'ं': 'n', 'ः': 'h', 'ँ': 'n', '्': ''
        };

        const CONSONANTS = {
          'क': 'k', 'ख': 'kh', 'ग': 'g', 'घ': 'gh', 'ङ': 'ng',
          'च': 'ch', 'छ': 'chh', 'ज': 'j', 'झ': 'jh', 'ञ': 'ny',
          'ट': 't', 'ठ': 'th', 'ड': 'd', 'ढ': 'dh', 'ण': 'n',
          'त': 't', 'थ': 'th', 'द': 'd', 'ध': 'dh', 'न': 'n',
          'प': 'p', 'फ': 'ph', 'ब': 'b', 'भ': 'bh', 'म': 'm',
          'य': 'y', 'र': 'r', 'ल': 'l', 'व': 'v', 'श': 'sh',
          'ष': 'sh', 'स': 's', 'ह': 'h',
          'क़': 'q', 'ख़': 'kh', 'ग़': 'gh', 'ज़': 'z', 'ड़': 'r', 'ढ़': 'rh', 'फ़': 'f'
        };

        let result = '';
        const len = text.length;

        for (let i = 0; i < len; i++) {
          const char = text[i];
          const nextChar = (i + 1 < len) ? text[i + 1] : '';

          if (CONSONANTS[char]) {
            const cons = CONSONANTS[char];
            if (nextChar === '्') {
              result += cons;
              i++;
            } else if (MATRAS[nextChar]) {
              result += cons + MATRAS[nextChar];
              i++;
            } else if (/[\u0905-\u0939]/.test(nextChar)) {
              result += cons + 'a';
            } else if (nextChar === ' ' || !nextChar || /[.,!?;:\n]/.test(nextChar)) {
              result += cons;
            } else {
              result += cons;
            }
          } else if (VOWELS[char]) {
            result += VOWELS[char];
          } else if (MATRAS[char]) {
            result += MATRAS[char];
          } else {
            result += char;
          }
        }
        return result;
      }

      async function googleTranslate(text, targetLang) {
        try {
          const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
          const resp = await fetch(url);
          if (!resp.ok) return null;
          const data = await resp.json();
          return (data[0] || []).map(s => s[0]).join('') || null;
        } catch (e) { return null; }
      }

      // Called after a turn finalises — computes EN + HI translations in background.
      async function computeTranslations(turnEl, originalText) {
        turnEl.dataset.original = originalText;
        const [en, hi] = await Promise.all([
          googleTranslate(originalText, 'en'),
          googleTranslate(originalText, 'hi')
        ]);
        if (en) turnEl.dataset.en = en;
        if (hi) turnEl.dataset.hi = hi;

        if (viewMode === 'en' && en) turnEl.textContent = en;
        else if (viewMode === 'hi' && hi) turnEl.textContent = hi;
        scrollBoxToBottom(turnEl.parentElement);
      }

      // Re-renders every finalized turn line for the current viewMode.
      function applyViewMode() {
        document.querySelectorAll('.turn-line:not(.interim)').forEach(el => {
          const orig = el.dataset.original;
          if (!orig) return;
          if (viewMode === 'en') el.textContent = el.dataset.en || orig;
          else if (viewMode === 'hi') el.textContent = el.dataset.hi || orig;
          else el.textContent = orig;
          scrollBoxToBottom(el.parentElement);
        });
      }

      // ── Speaker box management ────────────────────────────────────────────
      const sessionClusterMap = {};

      function bringSpeakerBoxToTop(boxEl) {
        if (!boxEl || !speakerContainer) return;
        if (speakerContainer.firstElementChild !== boxEl) {
          speakerContainer.insertBefore(boxEl, speakerContainer.firstElementChild);
        }
      }

      function getOrCreateSpeakerBox(speakerName) {
        if (!speakerName) speakerName = 'A';
        // Normalize name: e.g. "vinay" or "Vinay" or "Speaker A"
        let normName = speakerName.trim();
        if (normName.startsWith('USR_')) {
          normName = normName.replace(/^USR_/, '').replace(/_/g, ' ');
        }
        if (/^[A-Z0-9]$/i.test(normName)) {
          if (sessionClusterMap[normName]) {
            normName = sessionClusterMap[normName];
          } else {
            normName = 'Speaker ' + normName.toUpperCase();
          }
        }

        // Match against registered users
        const foundUser = registeredUsers.find(u => (u.name || '').toLowerCase() === normName.toLowerCase());
        if (foundUser && foundUser.name) {
          normName = foundUser.name;
        }

        const customId = 'spk_' + normName.toLowerCase().replace(/[^a-z0-9_]/g, '_');

        if (speakerBoxes[customId]) {
          return speakerBoxes[customId];
        }

        if (emptyState && emptyState.parentNode) emptyState.remove();

        const idx = Object.keys(speakerBoxes).length;
        const color = SPEAKER_COLORS[idx % SPEAKER_COLORS.length];

        const avatarHtml = (foundUser && foundUser.avatar_b64)
          ? `<img class="spk-avatar-img" src="${foundUser.avatar_b64}" alt="${escapeHtml(normName)}">`
          : `<div class="spk-avatar-placeholder">${escapeHtml(normName.split(/\s+/).map(part => part[0]).join('').slice(0, 2).toUpperCase())}</div>`;
        const companyHtml = foundUser && foundUser.company_name
          ? `<div class="spk-company">${escapeHtml(foundUser.company_name)}</div>`
          : '';

        const boxEl = document.createElement('div');
        boxEl.className = 'speaker-box';
        boxEl.id = customId;
        boxEl.dataset.speaker = customId;
        boxEl.innerHTML = `
          <div class="speaker-box-header">
            ${avatarHtml}
            <div class="spk-identity">
              <div class="spk-identity-text">
                <div class="spk-name">${escapeHtml(normName)}</div>
                ${companyHtml}
              </div>
              <span class="spk-dot" style="background:${color}"></span>
            </div>
          </div>
          <div class="speaker-box-body"></div>
        `;

        bringSpeakerBoxToTop(boxEl);

        const newBox = {
          boxEl,
          bodyEl: boxEl.querySelector('.speaker-box-body'),
          color,
          name: normName,
        };
        speakerBoxes[customId] = newBox;
        return newBox;
      }

      function getOrCreateNamedSpeakerBox(realName) {
        return { speakerId: 'spk_' + realName.toLowerCase().replace(/[^a-z0-9_]/g, '_'), box: getOrCreateSpeakerBox(realName) };
      }

      function speakerName(idOrName) {
        if (!idOrName) return 'Speaker ?';
        let norm = String(idOrName).trim();
        if (norm.startsWith('spk_') || norm.startsWith('USR_')) {
          norm = norm.replace(/^(spk_|USR_)/, '').replace(/_/g, ' ');
        }
        if (speakerBoxes[idOrName]) {
          return speakerBoxes[idOrName].name;
        }
        const customId = 'spk_' + norm.toLowerCase().replace(/[^a-z0-9_]/g, '_');
        if (speakerBoxes[customId]) {
          return speakerBoxes[customId].name;
        }
        // If it's a single raw letter (e.g. 'A' -> 'Speaker A')
        if (/^[A-Z0-9]$/i.test(norm)) {
          if (sessionClusterMap[norm]) return sessionClusterMap[norm];
          return 'Speaker ' + norm.toUpperCase();
        }
        // Match against registered users
        const foundUser = registeredUsers.find(u => (u.name || '').toLowerCase() === norm.toLowerCase());
        if (foundUser && foundUser.name) return foundUser.name;
        return norm;
      }

      function escapeHtml(s) {
        const d = document.createElement('div'); d.innerText = s; return d.innerHTML;
      }

      function fmtTime() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      // ── Interim bar (pre-speaker text) ────────────────────────────────────
      function setInterimText(text) {
        if (!text) { interimBar.innerHTML = ''; interimEl = null; return; }
        if (!interimEl) {
          interimEl = document.createElement('div');
          interimEl.className = 'interim-text';
          interimBar.innerHTML = '';
          interimBar.appendChild(interimEl);
        }
        interimEl.textContent = text;
      }

      // ── AssemblyAI Turn handler ───────────────────────────────────────────
      let nextGlobalTurnOrder = 1;

      function handleAaiTurn(data, fTurns) {
        const turnOrder = data.turn_order;
        const text = data.transcript || '';
        const isFinal = !!data.end_of_turn;
        const rawSpk = data.speaker_label || null;
        const speakerId = (rawSpk && rawSpk !== 'PENDING') ? (sessionClusterMap[rawSpk] || rawSpk) : null;

        let entry = activeTurns[turnOrder];

        if (!entry) {
          // Brand new turn — create a line element
          const turnEl = document.createElement('div');
          turnEl.className = 'turn-line interim';

          if (speakerId) {
            const box = getOrCreateSpeakerBox(speakerId);
            if (!box.bodyEl.contains(turnEl)) {
              box.bodyEl.appendChild(turnEl);
            }
            scrollBoxToBottom(box.bodyEl);
          }
          // If no speaker yet, keep in interim bar (handled below)

          entry = { turnEl, speakerId };
          activeTurns[turnOrder] = entry;
        } else {
          // Existing turn — if speaker arrived/changed, move element into speaker box
          if (speakerId && speakerId !== entry.speakerId) {
            const box = getOrCreateSpeakerBox(speakerId);
            if (!box.bodyEl.contains(entry.turnEl)) {
              box.bodyEl.appendChild(entry.turnEl);
            }
            scrollBoxToBottom(box.bodyEl);
            entry.speakerId = speakerId;
            // The box this line just left may now be empty (it existed only to host
            // this one interim line). Clean it up immediately instead of waiting for
            // the next sync tick — that's the ghost-box race.
            cleanEmptySpeakerBoxes();
          }
        }

        // Update text
        if (speakerId) {
          entry.turnEl.textContent = text;
          // The text can grow after its element has already been added. Pin only
          // after that mutation, so every incoming update lands at the bottom.
          scrollBoxToBottom(entry.turnEl.parentElement);
          setInterimText(''); // clear interim bar if we now have a speaker
        } else {
          setInterimText(text); // show in interim bar until speaker known
          entry.turnEl.textContent = ''; // keep element empty until moved
        }

        // Start audio buffering for this turn
        if (!turnAudioBuffers[turnOrder]) {
          startTurnAudioBuffer(turnOrder);
        }

        if (!isFinal) return;

        // ── Finalize ──
        finalizeTurnAudioBuffer(turnOrder);
        delete activeTurns[turnOrder];
        entry.turnEl.classList.remove('interim');

        if (!text.trim()) {
          entry.turnEl.remove();
          setInterimText('');
          return;
        }

        // ── Extract contiguous word-level speaker segments ──
        const words = data.words || [];
        let segments = [];
        if (words.length > 0) {
          let cur = null;
          for (const w of words) {
            const spk = w.speaker || rawSpk || 'A';
            const wt = (w.word || w.text || '').trim();
            if (!wt) continue;
            if (!cur || cur.speaker !== spk) {
              if (cur) segments.push(cur);
              cur = { speaker: spk, words: [wt], startMs: w.start, endMs: w.end };
            } else {
              cur.words.push(wt);
              cur.endMs = w.end;
            }
          }
          if (cur) segments.push(cur);
        }

        // Fallback to single segment if no word diarization returned
        if (segments.length === 0) {
          segments = [{
            speaker: rawSpk || 'A',
            words: [text],
            startMs: 0,
            endMs: 0
          }];
        }

        const turnStartMs = words.length > 0 ? words[0].start : 0;

        segments.forEach((seg, idx) => {
          const segText = seg.words.join(' ').trim();
          if (!segText) return;

          const rawSegSpk = seg.speaker || rawSpk || 'A';
          const resolvedSegSpk = sessionClusterMap[rawSegSpk] || rawSegSpk;
          const segDuration = Math.max(0.4, ((seg.endMs - seg.startMs) / 1000) || (seg.words.length * 0.4));
          const segTurnOrder = nextGlobalTurnOrder++;

          let segEl;
          if (idx === 0) {
            segEl = entry.turnEl;
          } else {
            segEl = document.createElement('div');
            segEl.className = 'turn-line';
          }

          const box = getOrCreateSpeakerBox(resolvedSegSpk);
          segEl.dataset.turn = String(segTurnOrder);
          if (!box.bodyEl.contains(segEl)) {
            box.bodyEl.appendChild(segEl);
          }
          segEl.textContent = segText;
          scrollBoxToBottom(box.bodyEl);

          // Precise sliced audio for this specific speaker segment
          const segAudioB64 = getTurnAudioSliceBase64(turnOrder, seg.startMs, seg.endMs, turnStartMs);

          // Record for download
          rawLines.push({ time: fmtTime(), text: segText, speakerId: resolvedSegSpk });

          // Store for speaking chart
          fTurns[segTurnOrder] = { turnEl: segEl, speakerId: resolvedSegSpk, originalSpeakerId: rawSegSpk, text: segText, duration: segDuration };

          // Kick off background translation
          computeTranslations(segEl, segText);

          // Upload turn audio to backend (single source of truth: backend performs ECAPA-TDNN ID and persists to SQLite DB)
          uploadTurnAudioToBackend(segTurnOrder, segText, rawSegSpk, segAudioB64);
        });

        // Word-level diarization can resolve a segment to a DIFFERENT speaker box than the
        // one the interim line was originally created in (see the reparenting above). That
        // leaves the original box with zero children. Clean it up right here instead of
        // relying on the next sync tick, which is what let ghost boxes persist across a
        // dropped SSE connection or a backgrounded tab.
        cleanEmptySpeakerBoxes();

        setInterimText('');

        // Update speaking time chart from all finalized turns
        recalculateSpeakingChart(fTurns);

        // Prune old audio buffers
        pruneOldTurnAudio();
      }

      function scrollBoxToBottom(bodyEl) {
        if (!bodyEl || !bodyEl.classList.contains('speaker-box-body')) return;

        // Set it now, then once more on the next paint after the browser has
        // measured the new/edited line. Both assignments are instant (no smooth
        // animation), and every incoming update intentionally overrides a manual
        // upward scroll.
        const pin = () => { bodyEl.scrollTop = bodyEl.scrollHeight; };
        pin();
        requestAnimationFrame(pin);
      }

      // ── Audio Turn Buffering (for ECAPA-TDNN) ──────────────────────────────
      const TURN_AUDIO_MAX_SAMPLES = 16000 * 30;
      const turnAudioBuffers = {};  // turnOrder -> { chunks: [Int16Array, ...], totalSamples: int }
      let currentRecordingTurnOrder = null;

      function startTurnAudioBuffer(turnOrder) {
        currentRecordingTurnOrder = turnOrder;
        if (!turnAudioBuffers[turnOrder]) {
          turnAudioBuffers[turnOrder] = { chunks: [], totalSamples: 0 };
        }
      }

      function appendTurnAudio(turnOrder, int16Chunk) {
        const buf = turnAudioBuffers[turnOrder];
        if (!buf) return;
        if (buf.totalSamples >= TURN_AUDIO_MAX_SAMPLES) return; // cap
        buf.chunks.push(int16Chunk);
        buf.totalSamples += int16Chunk.length;
      }

      function finalizeTurnAudioBuffer(turnOrder) {
        if (currentRecordingTurnOrder === turnOrder) {
          currentRecordingTurnOrder = null;
        }
      }

      function getTurnAudioSliceBase64(turnOrder, startMs, endMs, turnStartMs) {
        const buf = turnAudioBuffers[turnOrder];
        if (!buf || buf.chunks.length === 0) return null;

        const merged = new Int16Array(buf.totalSamples);
        let offset = 0;
        for (const chunk of buf.chunks) {
          merged.set(chunk, offset);
          offset += chunk.length;
        }

        // Extract precise segment slice if timestamps provided
        if (startMs && endMs && endMs > startMs && turnStartMs !== undefined) {
          const sampleRate = 16000;
          const startSample = Math.max(0, Math.floor(((startMs - turnStartMs) / 1000) * sampleRate));
          const endSample = Math.min(merged.length, Math.ceil(((endMs - turnStartMs) / 1000) * sampleRate));
          if (endSample > startSample && (endSample - startSample) >= 0.3 * sampleRate) {
            const slice = merged.subarray(startSample, endSample);
            const bytes = new Uint8Array(slice.buffer, slice.byteOffset, slice.byteLength);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
          }
        }

        // Full buffer fallback
        const bytes = new Uint8Array(merged.buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }

      function getTurnAudioBase64(turnOrder) {
        return getTurnAudioSliceBase64(turnOrder);
      }

      // Prune old turn audio to prevent memory bloat (keep last 50 turns)
      function pruneOldTurnAudio() {
        const keys = Object.keys(turnAudioBuffers).map(Number).sort((a,b) => a - b);
        while (keys.length > 50) {
          delete turnAudioBuffers[keys.shift()];
        }
      }

      // ── Audio / WebSocket ─────────────────────────────────────────────────
      let listening = false;
      let isTranscriptionPaused = false;
      let micStream = null;
      let aaiSocket = null;
      let streamCtx = null, streamSource = null, streamProcessor = null, streamSilentGain = null;
      let lastAudioFrameTime = 0;

      function floatTo16BitPCM(float32Array) {
        const buffer = new ArrayBuffer(float32Array.length * 2);
        const view = new DataView(buffer);
        for (let i = 0; i < float32Array.length; i++) {
          const s = Math.max(-1, Math.min(1, float32Array[i]));
          view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return buffer;
      }

      async function setupMic() {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
        } catch (err) {
          setStatus('Mic access failed: ' + err.message);
        }
      }
      function teardownMic() {
        if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      }

      async function setupAssemblyAIStream() {
        let tokenData;
        try {
          const resp = await fetch('/api/streaming-token');
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          tokenData = await resp.json();
          if (tokenData.error) throw new Error(tokenData.error);
        } catch (err) {
          setStatus('Could not get streaming token: ' + err.message);
          return;
        }

        const fTurns = finalizedTurns;

        const wsParams = new URLSearchParams({
          sample_rate: '16000',
          speech_model: 'universal-3-5-pro',
          mode: 'balanced',
          language_code: 'en',
          speaker_labels: 'true',
          token: tokenData.token
        });
        aaiSocket = new WebSocket(`wss://streaming.assemblyai.com/v3/ws?${wsParams.toString()}`);

        aaiSocket.onopen = () => {
          setStatus(isTranscriptionPaused ? 'Paused (Transcribing stopped)' : 'Listening...');
          if (!streamCtx) {
            try {
              streamCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
              streamSource = streamCtx.createMediaStreamSource(micStream);
              streamProcessor = streamCtx.createScriptProcessor(2048, 1, 1);
              streamProcessor.onaudioprocess = (e) => {
                lastAudioFrameTime = Date.now();
                if (isTranscriptionPaused) {
                  setInterimText('');
                  return;
                }
                if (!aaiSocket || aaiSocket.readyState !== WebSocket.OPEN) return;
                const float32 = e.inputBuffer.getChannelData(0);
                const pcmBuf = floatTo16BitPCM(float32);
                aaiSocket.send(pcmBuf);

                if (currentRecordingTurnOrder !== null) {
                  const int16Copy = new Int16Array(pcmBuf.slice(0));
                  appendTurnAudio(currentRecordingTurnOrder, int16Copy);
                }
              };
              streamSource.connect(streamProcessor);
              streamSilentGain = streamCtx.createGain();
              streamSilentGain.gain.value = 0;
              streamProcessor.connect(streamSilentGain);
              streamSilentGain.connect(streamCtx.destination);
            } catch (err) {
              setStatus('Audio setup failed: ' + err.message);
            }
          }
        };

        aaiSocket.onmessage = (event) => {
          if (isTranscriptionPaused) {
            setInterimText('');
            return;
          }
          let data;
          try { data = JSON.parse(event.data); } catch (e) { return; }
          if (data.type === 'Begin') {
            setStatus(isTranscriptionPaused ? 'Paused (Transcribing stopped)' : 'Listening…');
          } else if (data.type === 'SpeechStarted') {
            // activity signal — no action needed
          } else if (data.type === 'Turn') {
            if (!isTranscriptionPaused) {
              handleAaiTurn(data, fTurns);
            }
          } else if (data.type === 'Termination') {
            setStatus('Stopped.');
            closeSocket();
          }
        };

        aaiSocket.onerror = () => { };
        aaiSocket.onclose = () => {
          if (listening && micStream) {
            setTimeout(() => {
              if (listening && micStream) {
                setupAssemblyAIStream();
              }
            }, 1500);
          }
        };
      }

      // Stop the audio capture graph (mic → processor → AAI socket) but leave socket open.
      function teardownAudio() {
        if (streamProcessor) { streamProcessor.disconnect(); streamProcessor.onaudioprocess = null; streamProcessor = null; }
        if (streamSilentGain) { streamSilentGain.disconnect(); streamSilentGain = null; }
        if (streamSource) { streamSource.disconnect(); streamSource = null; }
        if (streamCtx) { streamCtx.close().catch(() => { }); streamCtx = null; }
        Object.values(activeTurns).forEach(e => e.turnEl.remove());
        Object.keys(activeTurns).forEach(k => delete activeTurns[k]);
        setInterimText('');
      }

      // Close the WebSocket (called after Termination message arrives).
      function closeSocket() {
        if (aaiSocket) { aaiSocket.close(); aaiSocket = null; }
      }

      // Full teardown — used on page nav / mic failure / hard stop.
      function teardownStream() {
        teardownAudio();
        closeSocket();
      }

      // ── Watchdog ──────────────────────────────────────────────────────────
      let watchdogTimer = null;
      function startWatchdog() {
        stopWatchdog();
        watchdogTimer = setInterval(() => {
          if (!listening) return;
          if (Date.now() - lastAudioFrameTime > 8000) {
            handleMicFailure();
          }
        }, 2000);
      }
      function stopWatchdog() { if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; } }

      function handleMicFailure() {
        listening = false;
        stopWatchdog();
        teardownStream();
        teardownMic();
        setStatus('Mic dropped. Start recording to resume.');
        updateTranscribeButtonUI(false);
      }

      // ── Pure Typographic Word Cloud ──────────────────────────────────────
      const wordcloudPane = document.getElementById('wordcloudPane');
      let intelligenceTimer = null;
      let isFetchingIntelligence = false;

      const TYPOGRAPHY_COLORS = [
        '#4f46e5', // Indigo
        '#ea580c', // Sunset Orange
        '#16a34a', // Emerald Green
        '#dc2626', // Crimson Red
        '#9333ea', // Royal Purple
        '#0284c7', // Sky Blue
        '#ca8a04', // Amber Gold
        '#0d9488', // Deep Teal
        '#db2777', // Magenta Pink
        '#1e293b', // Slate Dark
        '#2563eb'  // Cobalt Blue
      ];

      function buildFullTranscript() {
        const sortedOrders = Object.keys(finalizedTurns).map(Number).sort((a, b) => a - b);
        if (sortedOrders.length === 0) return '';
        // Last 200 turns for context efficiency
        const recent = sortedOrders.slice(-200);
        return recent.map(to => {
          const ft = finalizedTurns[to];
          const spk = speakerName(ft.speakerId) || ft.speakerId || 'Speaker';
          return `${spk}: ${ft.text || ''}`;
        }).join('\n');
      }

      // ── Single unified intelligence call every 30 seconds ──────────────
      async function runLiveIntelligence() {
        if (!listening || isFetchingIntelligence || isTranscriptionPaused) return;
        const transcript = buildFullTranscript();
        if (!transcript || Object.keys(finalizedTurns).length < 2) return;

        isFetchingIntelligence = true;
        try {
          const resp = await fetch('/api/live-intelligence', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ transcript })
          });
          if (!resp.ok) { isFetchingIntelligence = false; return; }
          const data = await resp.json();

          // ── Update Discussion Topics (Word Cloud) ──
          if (data.words && data.words.length > 0) {
            renderWordCloud(data.words);
          }

          // ── Update Speaker Analysis Cards ──
          sbBody.querySelector('.sb-empty')?.remove();

          if (data.overall_summary) {
            renderOrUpdateMeetingSummary(data.overall_summary);
          }

          if (Array.isArray(data.speakers) && data.speakers.length > 0) {
            data.speakers.forEach(spk => renderOrUpdateSpeakerCard(spk));
          }

          // Prune stale speaker cards that no longer match active transcript speakers
          const activeSpeakerNames = new Set(
            Object.values(finalizedTurns).map(ft =>
              (speakerName(ft.speakerId) || ft.speakerId || '').trim().toLowerCase()
            )
          );
          sbBody.querySelectorAll('.sb-speaker-card').forEach(card => {
            const cardName = (card.querySelector('.sb-spk-name')?.textContent || '').trim().toLowerCase();
            const wordCount = getSpeakerWordCount(cardName);
            const isRegistered = (registeredUsers || []).some(u => (u.name || '').toLowerCase() === cardName);
            if (!activeSpeakerNames.has(cardName) || (!isRegistered && wordCount < 100)) {
              card.remove();
            }
          });

          // Threshold note
          const hasSpeakerCards = sbBody.querySelectorAll('.sb-speaker-card').length > 0;
          let note = document.getElementById('sb-threshold-note');
          if (!hasSpeakerCards) {
            if (!note) {
              note = document.createElement('div');
              note.id = 'sb-threshold-note';
              note.className = 'sb-empty';
              note.innerHTML = '<span class="sb-empty-icon">📊</span>Speaker sections are generated for registered profiles or speakers with 100+ words spoken.';
              sbBody.appendChild(note);
            }
          } else if (note) {
            note.remove();
          }

        } catch (e) {
        } finally {
          isFetchingIntelligence = false;
        }
      }

      const RANK_SIZES = [22, 19, 17, 15, 14, 13, 12, 11, 10];
      const RANK_WEIGHTS = ['700', '700', '700', '600', '600', '600', '500', '500', '500'];

      function renderWordCloud(wordList) {
        if (!wordcloudPane || !wordList || wordList.length === 0) return;
        wordcloudPane.innerHTML = '';

        const paneWidth = wordcloudPane.clientWidth || 280;
        const maxFitWidth = Math.max(160, paneWidth - 36);

        // Normalize word items: [text, weight]
        const items = wordList.map(item => {
          if (Array.isArray(item)) return [String(item[0]).trim(), Number(item[1]) || 20];
          return [String(item.text || item).trim(), Number(item.weight) || 20];
        }).filter(i => i[0] && i[0].length > 2);

        if (items.length === 0) return;

        // Sort by weight descending
        const sorted = [...items].sort((a, b) => b[1] - a[1]);

        // Arrange center-out with rank assigned
        const arranged = [];
        sorted.forEach((item, rank) => {
          let baseSize = RANK_SIZES[Math.min(rank, RANK_SIZES.length - 1)];
          const fontWeight = RANK_WEIGHTS[Math.min(rank, RANK_WEIGHTS.length - 1)];

          // Adapt font size to string length so long phrases fit cleanly
          const strLen = item[0].length;
          if (strLen > 8) {
            const maxAllowedForLength = Math.floor(maxFitWidth / (strLen * 0.58));
            baseSize = Math.min(baseSize, maxAllowedForLength);
          }
          const fontSize = Math.max(10, Math.min(22, baseSize));

          const itemWithStyle = { text: item[0], fontSize, fontWeight, rank };

          if (rank % 2 === 0) arranged.push(itemWithStyle);
          else arranged.unshift(itemWithStyle);
        });

        arranged.forEach((obj, idx) => {
          const color = TYPOGRAPHY_COLORS[(Math.abs(obj.text.charCodeAt(0) + idx)) % TYPOGRAPHY_COLORS.length];
          const span = document.createElement('span');
          span.className = 'wc-typography-word';
          span.style.fontSize = `${obj.fontSize}px`;
          span.style.fontWeight = obj.fontWeight;
          span.style.color = color;
          span.textContent = obj.text;
          wordcloudPane.appendChild(span);

          // Safeguard: if rendered element still exceeds container, smoothly scale font down
          if (span.offsetWidth > maxFitWidth) {
            const ratio = maxFitWidth / span.offsetWidth;
            const newSize = Math.max(10, Math.floor(obj.fontSize * ratio));
            span.style.fontSize = `${newSize}px`;
          }
        });
      }

      function startIntelligenceLoop() {
        stopIntelligenceLoop();
        intelligenceTimer = setInterval(runLiveIntelligence, 30000);
        // First intelligence run after 30 seconds of speech
        setTimeout(runLiveIntelligence, 30000);
      }

      function stopIntelligenceLoop() {
        if (intelligenceTimer) { clearInterval(intelligenceTimer); intelligenceTimer = null; }
      }

      // ── Recording control ─────────────────────────────────────────────────
      async function beginRecording() {
        listening = true;
        setStatus('Starting...');
        lastAudioFrameTime = Date.now();
        await setupMic();
        if (!micStream) { listening = false; updateTranscribeButtonUI(false); return; }
        await setupAssemblyAIStream();
        startWatchdog();
        startIntelligenceLoop();
      }

      function endRecording() {
        listening = false; stopWatchdog(); stopIntelligenceLoop();
        teardownMic();
        teardownAudio();
        if (aaiSocket && aaiSocket.readyState === WebSocket.OPEN) {
          try { aaiSocket.send(JSON.stringify({ type: 'Terminate' })); } catch (e) { }
        } else {
          closeSocket();
        }
      }

      // ── UI Events ─────────────────────────────────────────────────────────
      startBtn.addEventListener('click', () => {
        homePage.style.display = 'none';
        appPage.style.display = 'flex';
        initSpeakingChart();
        beginRecording();
      });

      if (btnToggleTranscribe) {
        btnToggleTranscribe.addEventListener('click', async () => {
          const nextState = isTranscriptionPaused; // if paused, start (true); if active, pause (false)
          updateTranscribeButtonUI(nextState);
          try {
            await fetch('/api/set-recording-state', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ is_transcribing: nextState })
            });
          } catch(e) {}
        });
      }

      // ── BACKGROUND: Upload turn audio to backend & auto-identify ────────
      let registeredUsers = [];

      async function uploadTurnAudioToBackend(turnOrder, text, speakerId, explicitAudioB64) {
        const audioB64 = explicitAudioB64 || getTurnAudioBase64(turnOrder) || '';
        try {
          await fetch('/api/store-turn-audio', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              turn_order: turnOrder,
              audio_b64: audioB64,
              text: text || '',
              speaker_label: speakerId || 'A'
            })
          });
        } catch(e) {}
      }

      // Reassign a turn to a named speaker or raw speaker box
      function reassignTurnToSpeaker(turnOrder, realName, isRawSpeakerId = false) {
        const ft = finalizedTurns[turnOrder];
        if (!ft || !realName) return;

        const oldSpeakerId = ft.speakerId;
        let targetSpeakerId, targetBox;
        if (isRawSpeakerId) {
          targetBox = getOrCreateSpeakerBox(realName);
          targetSpeakerId = realName;
        } else {
          const res = getOrCreateNamedSpeakerBox(realName);
          targetSpeakerId = res.speakerId;
          targetBox = res.box;
        }

        bringSpeakerBoxToTop(targetBox.boxEl);

        if (targetSpeakerId !== oldSpeakerId) {
          ft.turnEl.dataset.turn = String(turnOrder);
          if (!targetBox.bodyEl.contains(ft.turnEl)) {
            targetBox.bodyEl.appendChild(ft.turnEl);
          }
          scrollBoxToBottom(targetBox.bodyEl);
          ft.speakerId = targetSpeakerId;

          const line = rawLines.find(l => l.text === ft.text && l.speakerId === oldSpeakerId);
          if (line) line.speakerId = targetSpeakerId;
        }

        // Clean empty boxes if any box has 0 sentences left
        cleanEmptySpeakerBoxes();

        recalculateSpeakingChart(finalizedTurns);
      }

      function cleanEmptySpeakerBoxes() {
        if (!speakerContainer) return;
        const allBoxes = Array.from(speakerContainer.querySelectorAll('.speaker-box'));
        allBoxes.forEach(boxEl => {
          const body = boxEl.querySelector('.speaker-box-body');
          const lines = body ? body.querySelectorAll('.turn-line') : [];
          if (lines.length === 0) {
            boxEl.remove();
            for (const [sid, box] of Object.entries(speakerBoxes)) {
              if (box.boxEl === boxEl) {
                delete speakerBoxes[sid];
              }
            }
          }
        });
      }

      // Auto-identify a finalized turn against registered voiceprints with Cluster Inheritance

      async function autoIdentifyTurn(turnOrder, fTurns, explicitAudioB64) {
        if (!registeredUsers || registeredUsers.length === 0) {
          try {
            const r = await fetch('/api/registered-users');
            if (r.ok) { registeredUsers = (await r.json()).users || []; }
          } catch(e) {}
          if (!registeredUsers || registeredUsers.length === 0) {
            // When all profiles are wiped, never assign to any previous name
            for (const k of Object.keys(sessionClusterMap)) delete sessionClusterMap[k];
            return;
          }
        }

        const origSpk = (fTurns[turnOrder] && fTurns[turnOrder].originalSpeakerId) || 'A';
        const audioB64 = explicitAudioB64 || getTurnAudioBase64(turnOrder);

        if (!audioB64) {
          if (sessionClusterMap[origSpk] && fTurns[turnOrder]) {
            reassignTurnToSpeaker(turnOrder, sessionClusterMap[origSpk]);
          }
          return;
        }

        try {
          const resp = await fetch('/api/identify-turn', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ turn_order: turnOrder, audio_b64: audioB64 })
          });
          if (!resp.ok) return;
          const result = await resp.json();
          const conf = result.confidence_pct || 0;
          const matchedSpeaker = result.winner || (conf > 20.0 ? result.top_match : null);

          if (matchedSpeaker && fTurns[turnOrder]) {
            sessionClusterMap[origSpk] = matchedSpeaker;
            fTurns[turnOrder].voiceTagged = true;
            fTurns[turnOrder].voiceConfidence = conf + '%';
            reassignTurnToSpeaker(turnOrder, matchedSpeaker);
          } else if (sessionClusterMap[origSpk] && fTurns[turnOrder]) {
            const inheritedSpeaker = sessionClusterMap[origSpk];
            fTurns[turnOrder].voiceTagged = false;
            fTurns[turnOrder].clusterInherited = true;
            reassignTurnToSpeaker(turnOrder, inheritedSpeaker);
          }
        } catch(e) {}
      }

      // ── Reusable sync helpers (no more polling) ─────────────────────────────

      function updateSpeakerAvatars() {
        for (const [sid, box] of Object.entries(speakerBoxes)) {
          const currentName = (box.name || speakerName(sid) || '').trim().toLowerCase();
          const u = (registeredUsers || []).find(ru => {
            const rname = (ru.name || '').trim().toLowerCase();
            return rname === currentName || rname === sid.toLowerCase() || ('usr_' + rname.replace(/[^a-z0-9_]/g, '_')) === sid.toLowerCase();
          });
          const headerEl = box.boxEl.querySelector('.speaker-box-header');
          if (headerEl) {
            let avatarEl = headerEl.querySelector('.spk-avatar-img');
            let placeholderEl = headerEl.querySelector('.spk-avatar-placeholder');
            const identityTextEl = headerEl.querySelector('.spk-identity-text');
            let companyEl = headerEl.querySelector('.spk-company');
            const companyName = (u && u.company_name) ? u.company_name : '';
            if (companyName) {
              if (!companyEl && identityTextEl) {
                companyEl = document.createElement('div');
                companyEl.className = 'spk-company';
                identityTextEl.appendChild(companyEl);
              }
              companyEl.textContent = companyName;
            } else if (companyEl) {
              companyEl.remove();
            }
            if (u && u.avatar_b64) {
              if (!avatarEl) {
                avatarEl = document.createElement('img');
                avatarEl.className = 'spk-avatar-img';
                avatarEl.alt = box.name || 'Speaker profile';
                headerEl.insertBefore(avatarEl, headerEl.firstChild);
              }
              if (placeholderEl) placeholderEl.remove();
              if (avatarEl.src !== u.avatar_b64) avatarEl.src = u.avatar_b64;
            } else if (avatarEl) {
              avatarEl.remove();
              placeholderEl = document.createElement('div');
              placeholderEl.className = 'spk-avatar-placeholder';
              placeholderEl.textContent = (box.name || 'SP').split(/\s+/).map(part => part[0]).join('').slice(0, 2).toUpperCase();
              headerEl.insertBefore(placeholderEl, headerEl.firstChild);
            }
          }
        }
      }

      function syncTurnsFromServer(turns) {
        if (!turns) return;
        const changedBodies = new Set();
        if (turns.length === 0) {
          for (const k of Object.keys(sessionClusterMap)) delete sessionClusterMap[k];
        }

        const incomingTurnOrders = new Set(turns.map(t => Number(t.turn_order)));

        // 1. Remove turns from client DOM and fTurns if they were deleted/cleared in DB
        for (const [tOrderStr, ft] of Object.entries(finalizedTurns)) {
          const to = Number(tOrderStr);
          if (!incomingTurnOrders.has(to)) {
            if (ft.turnEl && ft.turnEl.parentNode) {
              ft.turnEl.remove();
            }
            delete finalizedTurns[to];
          }
        }

        // 2. Sort turns in ascending turn_order so they appear in chronological order
        const sorted = [...turns].sort((a, b) => Number(a.turn_order) - Number(b.turn_order));

        // 3. Render or update every turn from the database
        sorted.forEach(t => {
          const rawSpeaker = t.speaker_label || 'A';
          // 30% is the single tentative-tier floor shared with app.py's resolve_speaker_display()
          // and admin.html. Below it a turn is unassigned and only shows under "Speaker X" until
          // the backend is confident enough (or a human tags it).
          if (t.tagged_as) {
            sessionClusterMap[rawSpeaker] = t.tagged_as;
          } else if (t.predicted_speaker && (t.predicted_confidence || 0) >= 30.0) {
            sessionClusterMap[rawSpeaker] = t.predicted_speaker;
          }

          const turnOrder = Number(t.turn_order);
          const conf = t.predicted_confidence || 0;
          // Prefer the server-resolved name (single source of truth) when present; fall back to the
          // local 30% gate + sessionClusterMap inheritance for older server responses.
          const assignedSpeaker = (t.resolved_speaker_name || t.tagged_as || (conf >= 30.0 ? t.predicted_speaker : null) || sessionClusterMap[rawSpeaker] || ('Speaker ' + rawSpeaker)).trim();

          const targetBox = getOrCreateSpeakerBox(assignedSpeaker);
          const targetSpeakerId = targetBox.boxEl.id;

          let ft = finalizedTurns[turnOrder];
          if (!ft) {
            // New turn loaded from DB
            const turnEl = document.createElement('div');
            turnEl.className = 'turn-line';
            turnEl.dataset.turn = String(turnOrder);
            turnEl.textContent = t.text || '';
            turnEl.dataset.original = t.text || '';
            targetBox.bodyEl.appendChild(turnEl);
            changedBodies.add(targetBox.bodyEl);

            finalizedTurns[turnOrder] = {
              turnEl,
              speakerId: targetSpeakerId,
              originalSpeakerId: rawSpeaker,
              text: t.text || '',
              duration: Math.max(0.4, (t.text || '').split(/\s+/).length * 0.4)
            };

            rawLines.push({ time: fmtTime(), text: t.text || '', speakerId: targetSpeakerId });
            computeTranslations(turnEl, t.text || '');
          } else {
            // Update existing turn if changed
            ft.turnEl.dataset.turn = String(turnOrder);
            if (t.text && ft.text !== t.text) {
              ft.text = t.text;
              ft.turnEl.textContent = t.text;
              ft.turnEl.dataset.original = t.text;
              computeTranslations(ft.turnEl, t.text);
              changedBodies.add(ft.turnEl.parentElement);
            }
            if (ft.speakerId !== targetSpeakerId) {
              if (!targetBox.bodyEl.contains(ft.turnEl)) {
                targetBox.bodyEl.appendChild(ft.turnEl);
              }
              changedBodies.add(targetBox.bodyEl);
              ft.speakerId = targetSpeakerId;
            }
          }

          if (turnOrder >= nextGlobalTurnOrder) {
            nextGlobalTurnOrder = turnOrder + 1;
          }
        });

        // Only touch the panel that changed. Re-processing every speaker panel on
        // each event caused the visible refresh/flicker.
        changedBodies.forEach(scrollBoxToBottom);

        // 4. Clean empty speaker boxes
        cleanEmptySpeakerBoxes();

        // Keep the active speaker at the top, but do not reorder anything when it
        // is already there. This avoids a needless DOM refresh on each update.
        const spkLatestTurn = {};
        for (const [tOrderStr, ft] of Object.entries(finalizedTurns)) {
          const to = Number(tOrderStr);
          const sid = ft.speakerId;
          if (!spkLatestTurn[sid] || to > spkLatestTurn[sid]) {
            spkLatestTurn[sid] = to;
          }
        }

        const sortedBoxes = Object.entries(speakerBoxes).sort((a, b) => {
          const toA = spkLatestTurn[a[0]] || 0;
          const toB = spkLatestTurn[b[0]] || 0;
          return toB - toA;
        });

        const newestBox = sortedBoxes.length ? sortedBoxes[0][1].boxEl : null;
        if (newestBox && speakerContainer.firstElementChild !== newestBox) {
          speakerContainer.insertBefore(newestBox, speakerContainer.firstElementChild);
        }

        // 5. Empty state handling
        if (Object.keys(finalizedTurns).length === 0) {
          if (emptyState && !emptyState.parentNode) {
            speakerContainer.appendChild(emptyState);
          }
        } else if (emptyState && emptyState.parentNode) {
          emptyState.remove();
        }

        // 6. Keep rawLines perfectly synchronized with finalizedTurns
        rawLines.length = 0;
        sorted.forEach(t => {
          const ft = finalizedTurns[Number(t.turn_order)];
          if (ft) {
            rawLines.push({
              time: fmtTime(),
              text: ft.text || t.text || '',
              speakerId: ft.speakerId,
            });
          }
        });

        recalculateSpeakingChart(finalizedTurns);
        updateSpeakerAvatars();
      }

      let turnsSyncInFlight = false;
      let turnsSyncQueued = false;

      async function syncTurns() {
        // EventSource can emit several notifications for one transcript change.
        // Coalesce them so the DOM is updated once in the background instead of
        // repeatedly repainting the same speaker panels.
        if (turnsSyncInFlight) {
          turnsSyncQueued = true;
          return;
        }
        turnsSyncInFlight = true;
        try {
          const resp = await fetch('/api/turns');
          if (resp.ok) {
            const data = await resp.json();
            syncTurnsFromServer(data.turns || []);
          }
        } catch(e) {
        } finally {
          turnsSyncInFlight = false;
          if (turnsSyncQueued) {
            turnsSyncQueued = false;
            syncTurns();
          }
        }
      }

      async function syncUsers() {
        try {
          const resp = await fetch('/api/registered-users');
          if (resp.ok) {
            const data = await resp.json();
            registeredUsers = data.users || [];
            updateSpeakerAvatars();
          }
        } catch(e) {}
      }

      async function syncAnalytics() {
        try {
          const aResp = await fetch('/api/meeting-analytics');
          if (aResp && aResp.ok) {
            const aData = await aResp.json();
            // Restore Wordcloud / Topics from SQLite DB
            if (Array.isArray(aData.wordcloud)) {
              if (aData.wordcloud.length > 0) {
                renderWordCloud(aData.wordcloud);
              } else {
                wordcloudPane.innerHTML = '<span class="wc-empty-msg">Discussion topics will appear here.</span>';
              }
            }
            // Restore Speaker Intelligence Analysis from SQLite DB
            if (aData.analysis && typeof aData.analysis === 'object' && Object.keys(aData.analysis).length > 0) {
              if (aData.analysis.overall_summary) {
                renderOrUpdateMeetingSummary(aData.analysis.overall_summary);
              }
              if (Array.isArray(aData.analysis.speakers) && aData.analysis.speakers.length > 0) {
                aData.analysis.speakers.forEach(spk => renderOrUpdateSpeakerCard(spk));
              }
            }
          }
        } catch(e) {}
      }

      async function syncFromServer() {
        syncTurns();
        syncUsers();
        syncAnalytics();
        try {
          const rResp = await fetch('/api/recording-state');
          if (rResp && rResp.ok) {
            const rData = await rResp.json();
            isTranscriptionPaused = !rData.is_transcribing;
            updateTranscribeButtonUI(rData.is_transcribing);
            if (isTranscriptionPaused) {
              setStatus('Paused (Transcribing stopped)');
            }
          }
        } catch(e) {}
      }

      // ── Real-Time EventSource with Auto-Reconnect ─────────────────────────
      function setupEventSource() {
        if (!window.EventSource) return;
        let retryDelay = 1000;
        function connect() {
          try {
            const es = new EventSource('/api/stream-events');
            es.addEventListener('open', () => { retryDelay = 1000; });
            es.addEventListener('connected', () => {
              retryDelay = 1000;
              syncTurns();
              syncUsers();
            });
            es.addEventListener('turn_update', () => { syncTurns(); });
            es.addEventListener('tag_updated', (e) => {
              try {
                const data = JSON.parse(e.data);
                if (data.turn_order && data.tagged_as) {
                  reassignTurnToSpeaker(data.turn_order, data.tagged_as);
                }
              } catch(err) {}
              syncTurns();
            });
            es.addEventListener('turns_updated', () => { syncTurns(); });
            es.addEventListener('turn_deleted', () => { syncTurns(); });
            es.addEventListener('users_updated', () => { syncUsers(); syncTurns(); });
            es.addEventListener('turns_cleared', () => {
              Object.values(finalizedTurns).forEach(ft => { if (ft.turnEl) ft.turnEl.remove(); });
              for (const k of Object.keys(finalizedTurns)) delete finalizedTurns[k];
              for (const [sid, box] of Object.entries(speakerBoxes)) {
                if (box.boxEl) box.boxEl.remove();
                delete speakerBoxes[sid];
              }
              for (const k of Object.keys(sessionClusterMap)) delete sessionClusterMap[k];
              for (const k of Object.keys(turnAudioBuffers)) delete turnAudioBuffers[k];
              for (const k of Object.keys(activeTurns)) {
                if (activeTurns[k].turnEl) activeTurns[k].turnEl.remove();
                delete activeTurns[k];
              }
              if (emptyState && !emptyState.parentNode) speakerContainer.appendChild(emptyState);
              rawLines.length = 0;
              nextGlobalTurnOrder = 1;
              recalculateSpeakingChart(finalizedTurns);
              wordcloudPane.innerHTML = '<span class="wc-empty-msg">Discussion topics will appear here.</span>';
              sbBody.innerHTML = '<div class="sb-empty"><span class="sb-empty-icon">📊</span>Speaker sections are generated for registered profiles or speakers with 100+ words spoken.</div>';
              syncTurns();
            });
            es.addEventListener('cleared', () => {
              Object.values(finalizedTurns).forEach(ft => { if (ft.turnEl) ft.turnEl.remove(); });
              for (const k of Object.keys(finalizedTurns)) delete finalizedTurns[k];
              for (const [sid, box] of Object.entries(speakerBoxes)) {
                if (box.boxEl) box.boxEl.remove();
                delete speakerBoxes[sid];
              }
              for (const k of Object.keys(sessionClusterMap)) delete sessionClusterMap[k];
              for (const k of Object.keys(turnAudioBuffers)) delete turnAudioBuffers[k];
              for (const k of Object.keys(activeTurns)) {
                if (activeTurns[k].turnEl) activeTurns[k].turnEl.remove();
                delete activeTurns[k];
              }
              if (emptyState && !emptyState.parentNode) speakerContainer.appendChild(emptyState);
              rawLines.length = 0;
              registeredUsers = [];
              nextGlobalTurnOrder = 1;
              recalculateSpeakingChart(finalizedTurns);
              updateSpeakerAvatars();
              wordcloudPane.innerHTML = '<span class="wc-empty-msg">Discussion topics will appear here.</span>';
              sbBody.innerHTML = '<div class="sb-empty"><span class="sb-empty-icon">📊</span>Speaker sections are generated for registered profiles or speakers with 100+ words spoken.</div>';
              syncTurns();
            });
            es.addEventListener('analysis_updated', (e) => {
              try {
                const data = JSON.parse(e.data);
                if (data.overall_summary) renderOrUpdateMeetingSummary(data.overall_summary);
                if (Array.isArray(data.speakers)) data.speakers.forEach(spk => renderOrUpdateSpeakerCard(spk));
              } catch(err) {}
            });
            es.addEventListener('wordcloud_updated', (e) => {
              try {
                const data = JSON.parse(e.data);
                if (Array.isArray(data.words) && data.words.length > 0) renderWordCloud(data.words);
              } catch(err) {}
            });
            es.addEventListener('wordcloud_cleared', () => {
              wordcloudPane.innerHTML = '<span class="wc-empty-msg">Discussion topics will appear here.</span>';
            });
            es.addEventListener('analysis_cleared', () => {
              sbBody.innerHTML = '<div class="sb-empty"><span class="sb-empty-icon">📊</span>Speaker sections are generated for registered profiles or speakers with 100+ words spoken.</div>';
            });
            es.addEventListener('recording_state_changed', (e) => {
              try {
                const data = JSON.parse(e.data);
                isTranscriptionPaused = !data.is_transcribing;
                updateTranscribeButtonUI(data.is_transcribing);
                if (isTranscriptionPaused) {
                  setStatus('Paused (Transcribing stopped)');
                  setInterimText('');
                  Object.values(activeTurns).forEach(e => e.turnEl.remove());
                  for (const k of Object.keys(activeTurns)) delete activeTurns[k];
                } else {
                  if (listening) setStatus('Listening…');
                }
              } catch(err) {}
            });
            es.onerror = () => {
              es.close();
              retryDelay = Math.min(retryDelay * 2, 15000);
              setTimeout(connect, retryDelay);
            };
          } catch(e) {
            setTimeout(connect, retryDelay);
          }
        }
        connect();
      }

      setupEventSource();
      syncFromServer();


      // ── Language toggle buttons (Roman / Hinglish | English | Hindi) ─────
      // ── Language toggle buttons ───────────────────────────────────────────
      function setViewMode(mode) {
        viewMode = mode;
        btnEnglish.classList.toggle('active', mode === 'en');
        btnHindi.classList.toggle('active', mode === 'hi');
        applyViewMode();
      }
      btnEnglish.addEventListener('click', () => {
        setViewMode(viewMode === 'en' ? 'original' : 'en');
      });
      btnHindi.addEventListener('click', () => {
        setViewMode(viewMode === 'hi' ? 'original' : 'hi');
      });

      // ── AI ANALYSIS SIDEBAR & PER-SPEAKER INTELLIGENCE ────────────────────
      const aiAnalysisBtn = document.getElementById('aiAnalysisBtn');
      const aiSidebar = document.getElementById('aiSidebar');
      const sbClose = document.getElementById('sbClose');
      const sbBody = document.getElementById('sbBody');
      const appPageEl = document.getElementById('app-page');

      let analysisTimer = null;
      let isAnalysing = false;

      function openSidebar() {
        aiSidebar.classList.add('open');
        appPageEl.classList.add('sidebar-open');
        if (!sbBody.querySelector('.sb-speaker-card') && rawLines.length > 0) {
          runAnalysis();
        }
      }
      function closeSidebar() {
        aiSidebar.classList.remove('open');
        appPageEl.classList.remove('sidebar-open');
      }
      aiAnalysisBtn.addEventListener('click', () => {
        aiSidebar.classList.contains('open') ? closeSidebar() : openSidebar();
      });
      sbClose.addEventListener('click', closeSidebar);

      function buildTranscriptText() {
        const sortedOrders = Object.keys(finalizedTurns).map(Number).sort((a, b) => a - b);
        if (sortedOrders.length === 0) return '';
        return sortedOrders.map(to => {
          const ft = finalizedTurns[to];
          const spk = speakerName(ft.speakerId) || ft.speakerId || 'Speaker';
          return `${spk}: ${ft.text || ''}`;
        }).join('\n');
      }

      function getScoreBadgeClass(score) {
        if (score >= 7.5) return 'high';
        if (score >= 5.0) return 'mid';
        return 'low';
      }

      function getSpeakerWordCount(name) {
        let count = 0;
        const target = (name || '').trim().toLowerCase();
        for (const [to, ft] of Object.entries(finalizedTurns)) {
          const spkName = (speakerName(ft.speakerId) || '').trim().toLowerCase();
          const spkId = (ft.speakerId || '').trim().toLowerCase();
          if (spkName === target || spkId === target || ('speaker ' + spkId) === target) {
            count += (ft.text || '').trim().split(/\s+/).filter(Boolean).length;
          }
        }
        return count;
      }

      function renderOrUpdateSpeakerCard(spk) {
        const name = (spk.name || 'Unknown Speaker').trim();
        const safeId = 'sb-spk-' + name.toLowerCase().replace(/[^a-z0-9_]/g, '_');

        // Eligibility Check: Registered backend user OR >= 100 words spoken
        const foundUser = registeredUsers.find(u => (u.name || '').toLowerCase() === name.toLowerCase());
        const wordCount = getSpeakerWordCount(name);
        const isEligible = !!foundUser || wordCount >= 100;

        if (!isEligible) {
          const existingCard = document.getElementById(safeId);
          if (existingCard) existingCard.remove();
          return;
        }

        const scoreVal = typeof spk.score === 'number' ? spk.score : (parseFloat(spk.score) || 5.0);
        const score = scoreVal.toFixed(1);
        const badgeClass = getScoreBadgeClass(scoreVal);
        const summary = spk.summary || '';
        const keyPoints = Array.isArray(spk.key_points) ? spk.key_points : [];
        const keywords = Array.isArray(spk.keywords) ? spk.keywords : [];
        const scoreReason = spk.score_reason || '';

        // Avatar lookup
        const initials = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() || 'SP';
        const avatarHtml = (foundUser && foundUser.avatar_b64)
          ? `<img class="sb-spk-avatar" src="${foundUser.avatar_b64}" alt="${escapeHtml(name)}">`
          : `<div class="sb-spk-avatar">${escapeHtml(initials)}</div>`;

        const keyPointsHtml = keyPoints.length > 0
          ? `<div class="sb-keypoints-wrap">
               <div class="sb-keypoints-title">Key Points & Takeaways</div>
               <ul class="sb-keypoints-list">
                 ${keyPoints.map(kp => `<li>${escapeHtml(kp)}</li>`).join('')}
               </ul>
             </div>`
          : '';

        const keywordsHtml = keywords.length > 0
          ? `<div class="sb-keywords">
               ${keywords.map(kw => `<span class="sb-keyword-tag">${escapeHtml(kw)}</span>`).join('')}
             </div>`
          : '';

        const scoreReasonHtml = scoreReason
          ? `<div class="sb-score-reason">💡 <strong>Value breakdown:</strong> ${escapeHtml(scoreReason)}</div>`
          : '';

        const cardContent = `
          <div class="sb-spk-head">
            ${avatarHtml}
            <div class="sb-spk-title-wrap">
              <div class="sb-spk-name">${escapeHtml(name)}</div>
            </div>
            <div class="sb-score-badge ${badgeClass}">⭐ ${score} / 10</div>
          </div>
          <div class="sb-spk-summary">${escapeHtml(summary)}</div>
          ${keyPointsHtml}
          ${scoreReasonHtml}
          ${keywordsHtml}
        `;

        let card = document.getElementById(safeId);
        if (!card) {
          card = document.createElement('div');
          card.className = 'sb-speaker-card';
          card.id = safeId;
          card.innerHTML = cardContent;
          sbBody.appendChild(card);
        } else {
          // Smooth in-place update without destroying card DOM
          card.innerHTML = cardContent;
          card.classList.add('updated');
          setTimeout(() => card.classList.remove('updated'), 1200);
        }
      }

      function renderOrUpdateMeetingSummary(overallSummary) {
        if (!overallSummary) return;
        let summaryCard = document.getElementById('sb-meeting-summary-card');
        if (!summaryCard) {
          summaryCard = document.createElement('div');
          summaryCard.className = 'sb-meeting-summary-card';
          summaryCard.id = 'sb-meeting-summary-card';
          summaryCard.innerHTML = `
            <div class="sb-meeting-summary-title">📌 Executive Overview</div>
            <div class="sb-meeting-summary-text">${escapeHtml(overallSummary)}</div>
          `;
          sbBody.insertBefore(summaryCard, sbBody.firstChild);
        } else {
          const textEl = summaryCard.querySelector('.sb-meeting-summary-text');
          if (textEl) textEl.textContent = overallSummary;
        }
      }

      async function runAnalysis() {
        // Legacy wrapper — triggers unified intelligence
        runLiveIntelligence();
      }

      function startAnalysisLoop() { /* handled by startIntelligenceLoop */ }
      function stopAnalysisLoop() { /* handled by stopIntelligenceLoop */ }


      // ── Download ──────────────────────────────────────────────────────────
      downloadBtn.addEventListener('click', () => {
        if (rawLines.length === 0) { alert('No transcript yet.'); return; }
        const text = rawLines.map(l => `[${l.time}] ${speakerName(l.speakerId)}: ${l.text}`).join('\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        a.href = url; a.download = `transcript-${stamp}.txt`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      });

    })();
  </script>
